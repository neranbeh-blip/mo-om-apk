name: Build MoPay Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apks:
    name: Build MoPay Android Applications
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 3. GRADLE 8.7
      #
      # The repository does not contain gradlew.
      # Therefore GitHub Actions installs Gradle directly.
      # ==========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================================
      # 4. ANDROID SDK
      # ==========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK is ready."

      # ==========================================================
      # 5. CREATE local.properties
      # ==========================================================
      - name: Configure Android SDK path
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "local.properties:"
          cat local.properties

      # ==========================================================
      # 6. SHOW PROJECT STRUCTURE
      # ==========================================================
      - name: Inspect Gradle project
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          find . \
            -maxdepth 3 \
            -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      # ==========================================================
      # 7. CHECK SETTINGS
      # ==========================================================
      - name: Verify Gradle modules
        shell: bash
        run: |
          set -e

          echo ""
          echo "Checking settings.gradle.kts..."

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          cat settings.gradle.kts

          echo ""
          echo "Checking application modules..."

          for MODULE in customer-app merchant-app agent-app
          do
            if [ ! -f "$MODULE/build.gradle.kts" ]; then
              echo "ERROR: $MODULE/build.gradle.kts not found."
              exit 1
            fi

            echo "OK: $MODULE"
          done

      # ==========================================================
      # 8. CHECK SUPABASE SECRETS
      # ==========================================================
      - name: Check Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi

          echo "Supabase configuration is available."

      # ==========================================================
      # 9. GRADLE CONFIGURATION
      # ==========================================================
      - name: Configure Gradle build properties
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          echo ""
          echo "Configuring build properties..."

          cat >> gradle.properties <<EOF

          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          EOF

          echo "Gradle properties configured."

      # ==========================================================
      # 10. CLEAN PROJECT
      # ==========================================================
      - name: Clean Gradle project
        shell: bash
        run: |
          set -e

          gradle clean --stacktrace

      # ==========================================================
      # 11. BUILD CUSTOMER
      # ==========================================================
      - name: Build Customer application
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BUILDING CUSTOMER APPLICATION"
          echo "=========================================="

          gradle :customer-app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ==========================================================
      # 12. BUILD MERCHANT
      # ==========================================================
      - name: Build Merchant application
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BUILDING MERCHANT APPLICATION"
          echo "=========================================="

          gradle :merchant-app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ==========================================================
      # 13. BUILD AGENT
      # ==========================================================
      - name: Build Agent application
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BUILDING AGENT APPLICATION"
          echo "=========================================="

          gradle :agent-app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ==========================================================
      # 14. FIND APK FILES
      # ==========================================================
      - name: Find generated APKs
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "GENERATED APK FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            ! -path "./.git/*" \
            | sort

      # ==========================================================
      # 15. COLLECT APKs
      # ==========================================================
      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p release-apks

          echo ""
          echo "Collecting APKs..."

          # ------------------------------------------------------
          # CUSTOMER
          # ------------------------------------------------------
          CUSTOMER_APK="$(find customer-app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$CUSTOMER_APK" ]; then
            cp "$CUSTOMER_APK" \
              "release-apks/MoPay-Customer-MTN.apk"

            echo "Customer APK:"
            echo "$CUSTOMER_APK"
          else
            echo "WARNING: Customer APK not found."
          fi

          # ------------------------------------------------------
          # MERCHANT
          # ------------------------------------------------------
          MERCHANT_APK="$(find merchant-app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$MERCHANT_APK" ]; then
            cp "$MERCHANT_APK" \
              "release-apks/MoPay-Merchant-MTN.apk"

            echo "Merchant APK:"
            echo "$MERCHANT_APK"
          else
            echo "WARNING: Merchant APK not found."
          fi

          # ------------------------------------------------------
          # AGENT
          # ------------------------------------------------------
          AGENT_APK="$(find agent-app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$AGENT_APK" ]; then
            cp "$AGENT_APK" \
              "release-apks/MoPay-Agent-MTN.apk"

            echo "Agent APK:"
            echo "$AGENT_APK"
          else
            echo "WARNING: Agent APK not found."
          fi

          echo ""
          echo "=========================================="
          echo "RELEASE APKs"
          echo "=========================================="

          ls -lah release-apks || true

      # ==========================================================
      # 16. UPLOAD APK ARTIFACT
      # ==========================================================
      - name: Upload MoPay APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-APKs
          path: release-apks/
          if-no-files-found: warn
          retention-days: 30

      # ==========================================================
      # 17. UPLOAD GRADLE REPORTS ON FAILURE
      # ==========================================================
      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-Gradle-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
