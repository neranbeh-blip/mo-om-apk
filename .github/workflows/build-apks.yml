name: Build MoPay Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apks:
    name: Build MoPay APKs
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Configure Android SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android here.
      # The GitHub runner already contains the Android SDK.
      # We accept licenses non-interactively.
      # ---------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Android SDK directory:"
            ls -la "$ANDROID_HOME" || true
            echo "cmdline-tools:"
            ls -la "$ANDROID_HOME/cmdline-tools" || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Accepting licenses again..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK installation completed."

          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      # ---------------------------------------------------------
      # 4. Display repository structure
      # ---------------------------------------------------------
      - name: Inspect repository
        shell: bash
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort \
            | head -300

      # ---------------------------------------------------------
      # 5. Inject Supabase configuration
      #
      # These are PUBLIC client-side values.
      # NEVER put service_role or operator API secrets here.
      # ---------------------------------------------------------
      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          echo "Checking Supabase configuration..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL GitHub secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY GitHub secret is missing."
            exit 1
          fi

          echo "Supabase URL configured."

          # Create a local Gradle properties file if Gradle projects
          # are present. This file is NOT committed.
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          EOF

          echo "local.properties created."

      # ---------------------------------------------------------
      # 6. Locate Gradle projects
      # ---------------------------------------------------------
      - name: Find Android projects
        shell: bash
        run: |
          echo "Searching for Gradle projects..."

          find . \
            -type f \
            \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            ! -path './.git/*' \
            | sort

      # ---------------------------------------------------------
      # 7. Build Customer MTN
      # ---------------------------------------------------------
      - name: Build Customer MTN
        shell: bash
        run: |
          set -e

          if [ -f "customer-app/MTN/gradlew" ]; then
            cd customer-app/MTN
            chmod +x gradlew

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          else
            echo "Customer MTN Gradle project not found."
            echo "Expected: customer-app/MTN/gradlew"
            exit 1
          fi

      # ---------------------------------------------------------
      # 8. Build Customer Orange
      # ---------------------------------------------------------
      - name: Build Customer Orange
        shell: bash
        run: |
          set -e

          if [ -f "customer-app/Orange/gradlew" ]; then
            cd customer-app/Orange
            chmod +x gradlew

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          else
            echo "Customer Orange Gradle project not found."
            echo "Expected: customer-app/Orange/gradlew"
            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Build Merchant MTN
      # ---------------------------------------------------------
      - name: Build Merchant MTN
        shell: bash
        run: |
          set -e

          if [ -f "merchant-app/MTN/gradlew" ]; then
            cd merchant-app/MTN
            chmod +x gradlew

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          else
            echo "Merchant MTN Gradle project not found."
            echo "Expected: merchant-app/MTN/gradlew"
            exit 1
          fi

      # ---------------------------------------------------------
      # 10. Build Merchant Orange
      # ---------------------------------------------------------
      - name: Build Merchant Orange
        shell: bash
        run: |
          set -e

          if [ -f "merchant-app/Orange/gradlew" ]; then
            cd merchant-app/Orange
            chmod +x gradlew

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          else
            echo "Merchant Orange Gradle project not found."
            echo "Expected: merchant-app/Orange/gradlew"
            exit 1
          fi

      # ---------------------------------------------------------
      # 11. Build Agent MTN
      # ---------------------------------------------------------
      - name: Build Agent MTN
        shell: bash
        run: |
          set -e

          if [ -f "agent-app/MTN/gradlew" ]; then
            cd agent-app/MTN
            chmod +x gradlew

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          else
            echo "Agent MTN Gradle project not found."
            echo "Expected: agent-app/MTN/gradlew"
            exit 1
          fi

      # ---------------------------------------------------------
      # 12. Build Agent Orange
      # ---------------------------------------------------------
      - name: Build Agent Orange
        shell: bash
        run: |
          set -e

          if [ -f "agent-app/Orange/gradlew" ]; then
            cd agent-app/Orange
            chmod +x gradlew

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          else
            echo "Agent Orange Gradle project not found."
            echo "Expected: agent-app/Orange/gradlew"
            exit 1
          fi

      # ---------------------------------------------------------
      # 13. Collect APKs
      # ---------------------------------------------------------
      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p release-apks

          echo "Searching for APK files..."

          find . \
            -type f \
            -name "*.apk" \
            ! -path './.git/*' \
            | sort

          echo ""
          echo "Copying APKs..."

          # Customer MTN
          find customer-app/MTN \
            -type f \
            -name "*debug*.apk" \
            -exec cp {} release-apks/MoPay-Customer-MTN.apk \; \
            2>/dev/null || true

          # Customer Orange
          find customer-app/Orange \
            -type f \
            -name "*debug*.apk" \
            -exec cp {} release-apks/MoPay-Customer-Orange.apk \; \
            2>/dev/null || true

          # Merchant MTN
          find merchant-app/MTN \
            -type f \
            -name "*debug*.apk" \
            -exec cp {} release-apks/MoPay-Merchant-MTN.apk \; \
            2>/dev/null || true

          # Merchant Orange
          find merchant-app/Orange \
            -type f \
            -name "*debug*.apk" \
            -exec cp {} release-apks/MoPay-Merchant-Orange.apk \; \
            2>/dev/null || true

          # Agent MTN
          find agent-app/MTN \
            -type f \
            -name "*debug*.apk" \
            -exec cp {} release-apks/MoPay-Agent-MTN.apk \; \
            2>/dev/null || true

          # Agent Orange
          find agent-app/Orange \
            -type f \
            -name "*debug*.apk" \
            -exec cp {} release-apks/MoPay-Agent-Orange.apk \; \
            2>/dev/null || true

          echo ""
          echo "Collected APKs:"
          ls -lah release-apks || true

      # ---------------------------------------------------------
      # 14. Upload APK artifact
      # ---------------------------------------------------------
      - name: Upload MoPay APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-APKs
          path: release-apks/
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------
      # 15. Upload build reports if build fails
      # ---------------------------------------------------------
      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-Gradle-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
