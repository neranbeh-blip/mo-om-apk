      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Checking sdkmanager..."
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Accepting licenses again..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK configuration completed successfully."

          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true
