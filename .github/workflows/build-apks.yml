name: Build MoPay Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apks:
    name: Build MoPay APKs
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Checking sdkmanager..."
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK configuration completed successfully."

      - name: Inspect repository
        shell: bash
        run: |
          echo "Repository structure:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort \
            | head -300

      - name: Check Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi

          echo "Supabase configuration detected."

      - name: Build Customer MTN
        shell: bash
        run: |
          set -e

          cd customer-app/MTN
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

      - name: Build Customer Orange
        shell: bash
        run: |
          set -e

          cd customer-app/Orange
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

      - name: Build Merchant MTN
        shell: bash
        run: |
          set -e

          cd merchant-app/MTN
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

      - name: Build Merchant Orange
        shell: bash
        run: |
          set -e

          cd merchant-app/Orange
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

      - name: Build Agent MTN
        shell: bash
        run: |
          set -e

          cd agent-app/MTN
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

      - name: Build Agent Orange
        shell: bash
        run: |
          set -e

          cd agent-app/Orange
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            -PSUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -PSUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p release-apks

          echo "Searching for APKs..."

          find . \
            -type f \
            -name "*.apk" \
            ! -path './.git/*' \
            | sort

          find customer-app/MTN \
            -type f -name "*.apk" \
            -exec cp {} release-apks/MoPay-Customer-MTN.apk \; \
            2>/dev/null || true

          find customer-app/Orange \
            -type f -name "*.apk" \
            -exec cp {} release-apks/MoPay-Customer-Orange.apk \; \
            2>/dev/null || true

          find merchant-app/MTN \
            -type f -name "*.apk" \
            -exec cp {} release-apks/MoPay-Merchant-MTN.apk \; \
            2>/dev/null || true

          find merchant-app/Orange \
            -type f -name "*.apk" \
            -exec cp {} release-apks/MoPay-Merchant-Orange.apk \; \
            2>/dev/null || true

          find agent-app/MTN \
            -type f -name "*.apk" \
            -exec cp {} release-apks/MoPay-Agent-MTN.apk \; \
            2>/dev/null || true

          find agent-app/Orange \
            -type f -name "*.apk" \
            -exec cp {} release-apks/MoPay-Agent-Orange.apk \; \
            2>/dev/null || true

          echo "Final APKs:"
          ls -lah release-apks || true

      - name: Upload MoPay APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-APKs
          path: release-apks/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-Gradle-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
