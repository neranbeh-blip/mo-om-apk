name: Build MoPay Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -path '*/bin/sdkmanager' \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."

      # =========================================================
      # REPOSITORY INSPECTION
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "REPOSITORY STRUCTURE"
          echo "=========================================="

          find . \
            -maxdepth 6 \
            -type f \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "=========================================="
          echo "GRADLE WRAPPERS"
          echo "=========================================="

          find . \
            -type f \
            -name "gradlew" \
            ! -path "./.git/*" \
            | sort

      # =========================================================
      # SUPABASE CONFIGURATION CHECK
      # =========================================================
      - name: Check Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          echo "Checking Supabase configuration..."

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR:"
            echo "NEXT_PUBLIC_SUPABASE_URL is missing from GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR:"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing from GitHub Secrets."
            exit 1
          fi

          echo "Supabase configuration detected."

      # =========================================================
      # BUILD ALL ANDROID PROJECTS AUTOMATICALLY
      # =========================================================
      - name: Build Android applications
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          FOUND=0

          echo ""
          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECTS"
          echo "=========================================="

          while IFS= read -r GRADLEW
          do

            FOUND=1

            PROJECT_DIR="$(dirname "$GRADLEW")"

            echo ""
            echo "=========================================="
            echo "ANDROID PROJECT FOUND"
            echo "=========================================="
            echo "Project: $PROJECT_DIR"
            echo "Gradle:  $GRADLEW"
            echo "=========================================="

            cd "$PROJECT_DIR"

            chmod +x ./gradlew

            echo ""
            echo "Running Gradle build..."

            ./gradlew clean assembleDebug \
              -PSUPABASE_URL="$SUPABASE_URL" \
              -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

            echo ""
            echo "Build completed:"
            echo "$PROJECT_DIR"

            cd - >/dev/null

          done < <(
            find . \
              -type f \
              -name "gradlew" \
              ! -path "./.git/*" \
              | sort
          )

          if [ "$FOUND" -eq 0 ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: NO GRADLE PROJECT FOUND"
            echo "=========================================="

            echo ""
            echo "Files in repository:"

            find . \
              -maxdepth 6 \
              -type f \
              ! -path "./.git/*" \
              | sort

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ALL ANDROID PROJECTS BUILT"
          echo "=========================================="

      # =========================================================
      # FIND APK FILES
      # =========================================================
      - name: Find generated APKs
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "GENERATED APK FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            ! -path "./.git/*" \
            | sort

      # =========================================================
      # COLLECT APK FILES
      # =========================================================
      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p release-apks

          echo ""
          echo "Collecting APK files..."

          APK_COUNT=0

          while IFS= read -r APK
          do

            APK_COUNT=$((APK_COUNT + 1))

            FILENAME="$(basename "$APK")"

            echo "Found: $APK"

            cp "$APK" "release-apks/$FILENAME"

          done < <(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" \
              | sort
          )

          echo ""
          echo "Total APKs found: $APK_COUNT"

          echo ""
          echo "Release directory:"

          ls -lah release-apks || true

      # =========================================================
      # UPLOAD APKs
      # =========================================================
      - name: Upload MoPay APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-APKs
          path: release-apks/
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # UPLOAD GRADLE LOGS IF BUILD FAILS
      # =========================================================
      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MoPay-Gradle-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
